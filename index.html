<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Baliball</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Casse-briques à balles multiples, jouable hors ligne.">
  <meta name="theme-color" content="#101014">
  <!-- iOS : plein écran une fois ajouté à l'écran d'accueil -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Baliball">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #101014;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    body { position: fixed; inset: 0; }
    #game {
      display: block;
      touch-action: none;
    }
    .overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px;
      background: rgba(16, 16, 20, 0.82);
      color: #fff;
      text-align: center;
      padding: 24px;
      padding-top: calc(24px + var(--sat));
      padding-bottom: calc(24px + var(--sab));
      z-index: 10;
    }
    .overlay.hidden { display: none; }
    .overlay h1 {
      font-size: 44px; font-weight: 800; letter-spacing: 2px;
      color: #8bd52c;
    }
    .overlay .big-score { font-size: 72px; font-weight: 800; line-height: 1; }
    .overlay p { font-size: 16px; color: #c9c9c9; }
    .overlay button {
      font: inherit;
      font-size: 19px; font-weight: 700;
      padding: 14px 44px;
      border: none; border-radius: 999px;
      background: #8bd52c; color: #14210a;
      letter-spacing: 1px;
      cursor: pointer;
    }
    .overlay button.secondary {
      background: transparent;
      border: 2px solid #555;
      color: #ddd;
    }
    .overlay .hint {
      position: absolute;
      bottom: calc(18px + var(--sab));
      left: 20px; right: 20px;
      font-size: 13px; color: #8a8a90;
      line-height: 1.5;
    }
    #offline-badge {
      display: inline-block;
      margin-top: 4px;
      font-size: 12px;
      color: #8bd52c;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="menu" class="overlay">
    <h1>BALIBALL</h1>
    <p id="menu-best"></p>
    <button id="btn-resume" class="hidden" style="display:none">REPRENDRE</button>
    <button id="btn-new">NOUVELLE PARTIE</button>
    <p>Glisse le doigt pour viser, relâche pour tirer.<br>
       Les briques descendent à chaque tour : ne les laisse pas atteindre le bas&nbsp;!</p>
    <span id="offline-badge"></span>
    <div class="hint" id="install-hint"></div>
  </div>

  <div id="gameover" class="overlay hidden">
    <p style="font-size:20px;letter-spacing:3px;color:#e0447a;font-weight:700">PARTIE TERMINÉE</p>
    <div class="big-score" id="go-score">1</div>
    <p id="go-best"></p>
    <button id="btn-retry">REJOUER</button>
  </div>

  <script src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function () {
          document.getElementById('offline-badge').textContent = '✓ Disponible hors ligne';
        }).catch(function () { /* http:// local : pas de SW, le jeu marche quand même */ });
      });
    }
    // Astuce d'installation iOS (affichée seulement dans Safari, pas une fois installé)
    (function () {
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      var standalone = window.navigator.standalone === true
        || window.matchMedia('(display-mode: standalone)').matches;
      if (isIOS && !standalone) {
        document.getElementById('install-hint').innerHTML =
          'Pour jouer hors ligne : bouton <strong>Partager</strong> ⬆︎ puis ' +
          '<strong>« Sur l\'écran d\'accueil »</strong>, et ouvre l\'app une première fois avec Internet.';
      }
    })();
  </script>
</body>
</html>
